raw_profile_text: |
  [basic_info]
  - name: taro
  - age: 32
  - location: 神奈川

  [interests]
  - カフェ巡り
    - 休みの日に落ち着いたカフェでのんびりするのが好き
    - プリンとかチーズケーキがあるとつい頼んでしまう
  - 写真
    - 景色や街並みを撮るのが好き
    - 旅行先で夕方の写真を撮ることが多い
  - 映画
    - 洋画をよく見る。サスペンスやヒューマンドラマ系が好き
    - 最近は「PERFECT DAYS」が印象に残ってる
  - 料理
    - 一人暮らししてから料理するようになった
    - パスタとチャーハンだけは少し自信ある
  - 散歩
    - 夜に音楽聴きながら歩くのが好き
    - 気づくと1時間くらい歩いてることがある
  - 水族館/動物園
    - のんびり見て回れる場所が好き
    - ラッコがいるとテンション上がる
  - 旅行
    - 詰め込みすぎないゆるい旅行派
    - 金沢に行った時の街並みとご飯がかなり良かった
  - 甘いもの
    - コンビニスイーツも結構好き
    - 深夜に甘いもの食べたくなるタイプ
  - 音楽
    - 邦ロックをよく聴く
    - 作業中はゆったりした曲を流してることが多い
  - ゲーム
    - RPGや雰囲気ゲーをよくやる
    - 最近は「Stardew Valley」をのんびりやってる
  - インドア全般
    - 家で映画見たりゲームしてる時間がかなり好き
    - でもたまに外出するとリフレッシュできるなって思う
